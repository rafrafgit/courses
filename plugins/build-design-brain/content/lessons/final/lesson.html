<script id="md" type="application/json">"# Final task \u2014 Take a design change all the way\n\n*In 4 steps, on your own.*\n\n## What you'll get\n\nThis time you do it on your own. A design change comes in, one that touches a component and a flow, and you take it all the way: into your design brain, the brain checked against Figma and your product, your command run on work that needs it, and what the result shows you added where it lasts. When it passes, the course is complete.\n\n1. Bring in the change.\n2. Record the decision behind it, and check your brain.\n3. Run your command on work that needs the change.\n4. Add what the result teaches.\n\n## Before we start\n\nHave ready the design change, a component that a flow uses, with its new frames or exports, and the third piece of work you set aside in Lesson 3, the one that needs the change. Keep out what you kept out before. This time I don't name your choices or teach: you've made each before, and if you're unsure how, I'll say which lesson. What passes is on the course's reference page: ask me to show it to you.\n\n## Step 1 \u2014 Bring in the change\n\nA change filed in one place and not the others leaves your brain disagreeing with itself, and the next run picks whichever page it reads first.\n\n> **\u25b6 Your turn:** Type `/bring-in` and give me the change.\n\nThe change is filed, and `log.md` lists the pages it touched.\n\n> **\u25b6 Your turn:** Ask me to open the component's page, and `DESIGN.md` if the change touched it, and read them through.\n\n## Step 2 \u2014 Record why, and check your brain\n\nA change without its reason gets undone by the next person who doesn't know it. And only a check against Figma and the shipped product shows whether your brain, your library and your product now agree.\n\n> **\u25b6 Your turn:** Tell me the decision behind the change, and how it changes the flow it affects.\n\nThe decision is in `decisions/`, and the flow page is updated. Before the work relies on them, `/check-brain` compares your pages with each other, with Figma and with your shipped product, and shows each difference and open question for you to settle.\n\n> **\u25b6 Your turn:** Ask me to open the decision and the flow page, read them through, then type `/check-brain` and settle what it finds.\n\n## Step 3 \u2014 Run your command\n\nOnly a session that didn't hear today's conversation shows whether your brain, not you, carries the change.\n\nThe run happens in your work session, after `/clear`. The result is saved in `work/`, in a folder with your command's name.\n\n> **\u25b6 Your turn:** In your work session, type `/clear`, then your command with the piece of work that needs the change. Open the result, then come back here and tell me it's in.\n> ```\n> /clear\n> ```\n\n## Step 4 \u2014 Review it, and add what it teaches\n\nA review that changes nothing is forgotten by the next run.\n\n> **\u25b6 Your turn:** Read your result in your work session as you would before using it, and tell me the rule, fact or check it leads to.\n\nWhat you added is in its file, and `log.md` lists it: it's where the next run reads it. Once you've read it, it's reviewed, and when that passes, the course is complete.\n\n> **\u25b6 Your turn:** Ask me to open the file your addition went into, read it there, and tell me it says what you meant.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your rule or check from the run is written, at the end of Step 4, a separate reviewer reads your brain, your command and the result. If it says \"Not yet\", you change what it names, and I have it checked again. When it passes, the course is complete.\n\n### How it's checked\n\nThe reviewer reads the decision, the pages the change touched, the result, and the file your rule or check went into. It doesn't judge the design: it judges whether the brain took the change in and the run used it.\n\n**Must-haves** (all needed to pass):\n\n1. The component's page says what changed and from when; your design system says so too where the change touches a value or rule; and the flow's page says how the change affects the flow. (Steps 1\u20132)\n2. A new decision says who made the change, why, and something you'd see that would reverse it. (Step 2)\n3. The changed pages agree with each other, with no open question left in their summaries. (Step 2)\n4. Your result uses the new version, as the changed page states it. (Step 3)\n5. From this run, you added a rule, fact or check about something the result got wrong or showed, that someone could check a later result against. (Step 4)\n\n**Nice-to-haves:**\n\n- More than one thing added from the run, each where it lasts.\n"</script>
