<script id="md" type="application/json">"# Lesson 3 \u2014 Hand over a recurring design job\n\n*In 4 steps.*\n\n## What you'll get\n\nAfter this lesson, a piece of design work you do again is one command: you type `/` and its name with what this piece is about, and it's done from your design brain and saved in your folder. When it's wrong, you say the rule once, and it goes where it lasts. You'll have the command in your product's folder, its results in `work/`, and your first correction in the file it belongs in.\n\n1. Tell me the job, what a good result must get right, and what it needs from your brain.\n2. Run it on a real piece, in your work session, and say what's wrong.\n3. Tell me the rule that fixes it, and how far it reaches.\n4. Run it again, and see the fix hold.\n\n## Before we start\n\nHave ready the design work you do again, at whatever frequency: work I can do from your brain and you'd check before using. Bring three real pieces of it, or what each is about: one to run now, one for after your correction, and one for the final task that a design change affects (a recent change and work that followed it count). Past pieces count.\n\n## Step 1 \u2014 Describe the job\n\nAsked for a piece of design work by its name alone, I produce the average one: plausible, generic, nothing that makes it yours. What makes it yours is what you'd send back, and only you know that. Say it so someone could check a result against it: \"clear\" or \"the right length\" can't be checked; whether every state is named can. A command keeps those checks with the job, in its own file, read only when you type `/` and its name. Naming the pages it reads makes it read those, not guess.\n\nI'll write your words into the command under their own headings, apart from the instructions every command gets: read your rules, `product.md` and `DESIGN.md`, never invent, mark what's missing `[ASK]`. Claude Code shows you the command before it's written.\n\n> **\u25b6 Your turn:** Tell me, in your own words, the job you're handing over, what it produces, what you'd send a result back for, which pages it reads, and a name for its command.\n\nYour command is `/` and the name you gave it, in its own folder under the `skills` link in your product's folder.\n\n> **\u25b6 Your turn:** Ask me to open your command's file, and read your job there, in your words.\n\n## Step 2 \u2014 Run it on a real piece\n\nA run in a session that didn't write the command shows what the command and your brain do on their own, which is what you'll rely on from now on. What it gets wrong is a gap in the command or the brain, not in the session.\n\nGive the command only what this piece is about, a line or your notes, keeping out what you kept out before: names of participants or customers, passwords, anything not cleared. Your brain has the rest. The result is saved in `work/`, in a folder with your command's name. If the command isn't found, come back here and I'll sort it out.\n\n> **\u25b6 Your turn:** In your work session, type `/clear`, then your command with what one real piece is about. Open the result, then come back here and tell me it's in.\n> ```\n> /clear\n> ```\n\nRead the result as you would before using it. What you'd change is what the next step fixes.\n\n> **\u25b6 Your turn:** Tell me what's wrong in the result, in your own words, or that nothing is.\n\n## Step 3 \u2014 Correct it where it lasts\n\nA correction said only in a conversation is gone next session; written where it belongs, it's read every time that kind of work is done, and it works only if you could check a result against it. So stop fixing the same mistake by hand in every spec; start saying the rule once.\n\nWhere it goes depends on what it is: a fact about your product to its page, a design-system rule to `DESIGN.md`, a rule for all design work to `CLAUDE.md`, a rule for this job to the command. Claude Code shows you the rule before it's written. Then your command and correction are reviewed; Step 4 comes once that passes.\n\n> **\u25b6 Your turn:** Pick one thing that was wrong, and tell me the rule that fixes it, in your own words.\n\nYour correction is in the file it belongs in, and `log.md` lists it as a correction.\n\n> **\u25b6 Your turn:** Ask me to open the file your correction went into, and read your rule there.\n\n## Step 4 \u2014 Run it again\n\nA fix lasts only if a run that never heard the correction follows it.\n\nRun it in your work session again, after `/clear`, with only what the next piece is about. If the rule doesn't hold, come back anyway: we'll look at why.\n\n> **\u25b6 Your turn:** In your work session, type `/clear`, then your command with what your second piece is about. Open the result, then come back here and tell me it's in.\n> ```\n> /clear\n> ```\n\nNothing here is graded. In the new result, look for the place your rule should have changed.\n\n> **\u25b6 Your turn:** Tell me whether your rule held, and where you see it.\n\n## You can now\n\nDesign work you do again is one command now: it's done from your design brain and saved in `work/`, and a correction goes where it lasts, so the next run gets it right. In your product's folder: your command under `skills`, its results in `work/`, and your correction in its file.\n\n## Next\n\nThe final task is yours alone: a design change comes in, and you take it all the way. Have ready the change (a component a flow uses, with its new frames or exports) and your third piece of work, the one that needs it.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your command and your first correction are written, at the end of Step 3, a separate reviewer that wasn't part of our conversation reads them. If it says \"Not yet\", you change what it names, and I have it checked again. Then you run the command again in Step 4, which is yours to see: nothing in it is graded.\n\n### How it's checked\n\nThe reviewer reads your command and the file your correction went into. It doesn't judge the results in `work/`: it judges whether your command and your correction say what this lesson asks, specifically enough to work.\n\n**Must-haves** (all needed to pass):\n\n1. Your command says what it produces, and at least one thing about its content you'd send a result back for, that someone could check in it. (Step 1)\n2. Your command says what it reads from your brain, beyond what every command reads anyway: the pages, or kinds of page. (Step 1)\n3. Your correction is a rule, or a fact on its page, that someone could check a result against. (Step 3)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- Your rule says what to do instead, not only what to avoid.\n- The command names a decision or flow page it reads, not only the design system.\n"</script>
