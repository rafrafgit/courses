<script id="md" type="application/json">"# Lesson 1 \u2014 Stop briefing Claude\n\n*In 3 steps.*\n\n## What you'll get\n\nAfter this lesson, you ask Claude for a piece of your usual work in one line, and it comes back built on what your business is: what you sell, your prices, how you work. The judgment calls that are yours, it brings back to you instead of guessing. You'll have your brain's first pages, `company.md` and `offer.md`, and your rules in `CLAUDE.md`, all in your business's folder, the one you started Claude Code in: open them in any text editor, or ask me to show one.\n\n1. Give me your business once, typed or as a document, and correct my drafts.\n2. Tell me which calls are yours, and what I do when work reaches one.\n3. Ask for a piece of your work in a fresh session, and see it built on your pages.\n\n## Before we start\n\nYour company brain is this folder, the one you named after your business: plain notes on your computer that I read before I work. Nothing in it is about your business yet; `CLAUDE.md` holds the rules I follow. Have ready your business, in your head or in a document, and one piece of work you do again and again.\n\n## Step 1 \u2014 Give me your business\n\nYour price list may be a year old, and your website may promise what you've stopped offering: I can't tell. I draft only what your material says and mark the rest. Only you know what's true now and what's missing. Think of someone minding your stall for a week: they take your price list, fix what's out of date before opening, and ask you what isn't on it. So stop briefing the AI every time; start giving it your business once, where every session reads it.\n\nI'll draft `company.md` and `offer.md` from what you give me. Where it says nothing, or two sources disagree, I write `[ASK: \u2026]` and ask you. Claude Code shows you each page before it's written: choose Yes, or No and tell me what's true.\n\n> **\u25b6 Your turn:** Give me your business, whichever way suits you: type what you sell, to whom, at what price and how you work; or tell me in plain words where a document is that says it (your price list in Downloads, say). A few sentences are enough. Leave clients and passwords out.\n\nYour brain's first pages are in this folder: `company.md` and `offer.md`. What you gave me is kept as it came in `inbox/`.\n\n## Step 2 \u2014 Tell me which calls are yours\n\nWith nothing to go on, I still answer, and my guess reads like fact. Your pages now settle the facts. The calls that are yours should come back to you, as the stall-minder saves for you whether to hold a piece back for a regular. I need to know which calls those are, and what to do when work reaches one.\n\nI'll write your answers into `CLAUDE.md`, the file I read at the start of every session, and Claude Code will ask you before it's written. Then a separate reviewer reads your pages and your rules before we go on.\n\n> **\u25b6 Your turn:** Tell me, in your own words, which kinds of decision you want brought back to you instead of me making them. A piano teacher might keep any refund for a missed lesson.\n\nYour rules are in `CLAUDE.md` in this folder, under \"Calls that are mine\" and \"At a gap\".\n\n## Step 3 \u2014 Ask for a piece of your work\n\nOnly a session that starts after your brain was written shows what it does on its own. This conversation watched you build it, so it knows too much to be a fair test.\n\nYour brain is saved in this folder, and the lesson waits for you. Restart rather than `/clear`, so the new session reads your brain from its first moment. If you change the brain after the run, restart and ask again.\n\n> **\u25b6 Your turn:** Type `/exit`, then `claude`, and ask for a piece of your usual work in one line, one that touches a call you named. Then type `/course:lesson`.\n> ```\n> /exit\n> claude\n> ```\n\nNothing here is graded: you're the reviewer now. Look for facts it took from your pages, the pages it names as sources, the call it brought back the way you chose, and anything it states that your brain doesn't have.\n\n> **\u25b6 Your turn:** Tell me what it took from your pages, how it handled your call, and anything it got wrong.\n\n## You can now\n\nYou can ask Claude for a piece of your usual work in one line and get it back built on your business: what you sell, your prices, how you work, with the calls that are yours brought back to you. Your brain's first pages, `company.md` and `offer.md`, and your rules in `CLAUDE.md` are in your business's folder.\n\n## Next\n\nIn Lesson 2 you bring in a real change in your business, and I keep the brain current, asking you whenever the new disagrees with the old.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your brain's first pages and your rules are written, at the end of Step 2, a separate reviewer that wasn't part of our conversation reads them. If it says \"Not yet\", you change what it names and I have it checked again. Once it passes, you run the test in Step 3, which is yours to see: nothing in it is graded. Then the lesson is done.\n\n### How it's checked\n\nThe reviewer reads only your brain's files: `company.md`, `offer.md` and `CLAUDE.md`. It doesn't judge your business, your documents, what you typed, or the run: it judges whether your brain holds the choices this lesson asks for, specifically enough to work.\n\n**Must-haves** (all needed to pass):\n\n1. Your pages say what you sell, to whom, at what price (or how you price) and how the work is done, with no gap left open, no client's name, and nothing that changes on its own, like bookings. (Step 1)\n2. Your brain names the kinds of call I bring back to you instead of making, specific enough to tell whether a new call is one. (Step 2)\n3. Your brain says whether, at something that's yours, I ask you first or finish and mark it, or when I do each, clearly enough to apply. (Step 2)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- Each call you keep says what you want brought with it (the options, what it would cost, who's waiting).\n- Your brain says where the business is going: a goal, and by when.\n"</script>
