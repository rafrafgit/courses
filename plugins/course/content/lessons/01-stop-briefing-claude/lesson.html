<script id="md" type="application/json">"# Lesson 1 \u2014 Stop briefing Claude\n\n*In 4 steps.*\n\n## What you'll get\n\nAfter this lesson, you ask Claude for a piece of your work in one line, and it comes back built on what your business is: what you sell, your prices, how you work. The calls that are yours, it brings back to you instead of guessing. You'll have your brain's first pages, `company.md` and `offer.md`, and your calls in `CLAUDE.md`, all in your business's folder: open them in any text editor, or ask me to show one.\n\n1. Give me your business, typed or from a document, and see my first drafts.\n2. Bring in past proposals if you have them, and correct the drafts.\n3. Tell me which calls are yours.\n4. Ask for a piece of your work in a fresh session.\n\n## Before we start\n\nYour company brain is this folder, the one you named after your business: plain notes on your computer that I read before I work. Nothing in it is about your business yet; `CLAUDE.md` holds the rules I follow. Have ready what you'd tell someone about your business, any documents that say it, and one piece of work you'll want done.\n\n## Step 1 \u2014 Give me your business\n\nThink of someone minding your stall for a week. They take your price list, fix what's out of date before opening, and ask you about what isn't on it. I'm in the same spot: your price list may be a year old, your website may promise what you've stopped offering, and I can't tell. I draft only what your material says, and mark every gap `[ASK: \u2026]`. The gaps show you exactly what only you know. So stop briefing the AI every time; start giving it your business once, where every session reads it.\n\nWhat comes in is kept as it came, in `inbox/` in this folder, so keep passwords out, and what changes on its own, like this week's bookings. Client documents come in the next step.\n\n> **\u25b6 Your turn:** Give me your business, with nothing that names a client yet: type what you sell, to whom, at what price and how you work; or tell me in plain words where a document is that says it (your price list in Downloads, say).\n\nAbove are my drafts, with my questions marked: nothing is written yet. Before any document that names a client comes in, one setting is yours to decide: whether your chats with me may be used to train future models. Either way, the course works the same.\n\n> **\u25b6 Your turn:** Open claude.ai/settings/data-privacy-controls in your browser, and tell me whether you'll keep model training on or turn it off.\n\n## Step 2 \u2014 Bring in your proposals, and correct me\n\nWhat you charged one client isn't necessarily your price, and an old proposal can contradict your price list. If I picked one, I'd be guessing, and my guess would read like fact. So where sources disagree, or a figure comes from one client's job, I mark it `[ASK]` and ask you.\n\nI copy a proposal with a client's email or phone into `private/`, not `inbox/`: I read it, like everything you give me, and never quote it in a page. It's still in the folder. Leave out anything under an NDA. Then I ask my questions, and Claude Code shows you each page before it's written: choose Yes, or No and tell me what's true.\n\n> **\u25b6 Your turn:** If you have past proposals or other documents that name clients, tell me where they are; if not, say so, and I'll go straight to my questions.\n\nYour brain's first pages are in this folder: `company.md` and `offer.md`. Your answers are kept, as you typed them, in `inbox/`.\n\n## Step 3 \u2014 Tell me which calls are yours\n\nWith nothing to go on, I still answer, and my guess reads like fact. Your pages now settle the facts. The calls that are yours should come back to you, as the stall-minder would leave you whether to open on a Sunday. I need to know which calls those are.\n\nI'll write your answer into `CLAUDE.md`, the file I read at the start of every session, and Claude Code will ask you before it's written. Then a separate reviewer reads your pages and your calls; if it says \"Not yet\", I'll tell you what to change.\n\n> **\u25b6 Your turn:** Tell me, in your own words, which kinds of decision you want brought back to you instead of me making them. A piano teacher might keep any refund for a missed lesson.\n\nYour calls are in `CLAUDE.md` in this folder, under \"Calls that are mine\".\n\n## Step 4 \u2014 Ask for a piece of your work\n\nOnly a session that starts after your brain was written shows what it does on its own. This conversation watched you build it, so it knows too much to be a fair test.\n\nYour brain is saved in this folder, and the lesson waits for you. Restart rather than `/clear`, so the new session reads your brain from its first moment, and start `claude` in this same window, in your business's folder. Where the work reaches a call of yours, it marks it for you rather than deciding. The result is saved in `work/other/`.\n\n> **\u25b6 Your turn:** Type `/exit`, then `claude`, and as your first message ask for a piece of your work in one line, one that touches a call you named. Then type `/course:lesson`.\n> ```\n> /exit\n> claude\n> ```\n\nNothing here is graded: you're the reviewer now. Ask me to show you the result in `work/other/`, and look for the facts it took from your pages, the pages it names, the call it marked for you, and anything it states that your brain doesn't have.\n\n> **\u25b6 Your turn:** Tell me what the result took from your pages, how it handled your call, and anything it got wrong.\n\n## You can now\n\nYou can ask Claude for a piece of your work in one line and get it back built on your business, with the calls that are yours brought back to you. Your brain's first pages, `company.md` and `offer.md`, and your calls in `CLAUDE.md` are in your business's folder, and the run's result is in `work/other/`.\n\n## Next\n\nIn Lesson 2 you bring in a real change and a client's material, and I keep the brain current. Have ready one real change, recent or coming, and one client's material: a past proposal, an enquiry, or notes on the work. With no clients yet, a prospect's enquiry or notes on the kind of client you're after.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your brain's first pages and your calls are written, at the end of Step 3, a separate reviewer that wasn't part of our conversation reads them. If it says \"Not yet\", you change what it names, and I have it checked again. Once it passes, you run the test in Step 4, which is yours to see: nothing in it is graded. Then the lesson is done.\n\n### How it's checked\n\nThe reviewer reads only two things in your brain: the summaries at the top of `company.md` and `offer.md` (the dated history below them isn't judged), and the calls section of `CLAUDE.md`. It doesn't open your documents or judge your business, which documents you brought, or the run. It judges whether your brain holds what this lesson asks of you, specifically enough to work.\n\n**Must-haves** (all needed to pass):\n\n1. Your pages say what you sell, to whom, at what price (or how you price, even \"not set yet\" with what you're aiming at) and how the work is done, with no gap left open and nothing that changes on its own, like bookings. (Step 2)\n2. Your `CLAUDE.md` names the kinds of call I bring back to you instead of making, specific enough to tell whether a new call is one. (Step 3)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- Each call you keep says what you want brought with it (the options, what it would cost, who's waiting).\n- Your brain says where the business is going: a goal, and by when.\n"</script>
