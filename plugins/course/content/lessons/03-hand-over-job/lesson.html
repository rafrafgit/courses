<script id="md" type="application/json">"# Lesson 3 \u2014 Hand over a recurring job\n\n*In 4 steps.*\n\n## What you'll get\n\nAfter this lesson, a piece of writing you do again and again is one command: you type `/` and its name, with what this piece is about, and it's drafted from your brain. When it's wrong, you say the rule once, and whether it's for all your work or this job, and it goes where it lasts, so the next run gets it right. You'll have the command, which you'll find through the `skills` link in your business's folder (a shortcut to where commands live), and your first correction in the file it belongs in, listed in `log.md`, your brain's record of changes.\n\n1. Tell me the job, what a good result must get right, and what it needs from your brain.\n2. Run it on a real piece, in a fresh session.\n3. Tell me what was wrong, and the rule that fixes it.\n4. Run it again, and see the fix hold.\n\n## Before we start\n\nHave ready the piece of writing you do again and again that needs no client's details, and three real pieces of it to run on: two for this lesson, one or more for your first week. For each, what it's about, or your notes for it; past pieces count. What the job needs from your business is in your brain; if something's missing, it will say so.\n\n## Step 1 \u2014 Describe the job\n\nAsked to \"write my newsletter\", I write the average newsletter: right facts, nothing that makes it yours. What makes it yours is what you'd send a draft back for, and only you know that. A command keeps those checks with the job, in its own file, read only when you type `/` and its name, so it never crowds your other work.\n\nI'll write the command's file from your words, in `.claude/skills/`, and Claude Code shows it to you before it's written.\n\n> **\u25b6 Your turn:** Tell me, in your own words, the job you're handing over: what it produces, and what you'd send a draft back for, things you could spot in it.\n\nYour command is `/<its name>`, in its own folder under the `skills` link in your business's folder.\n\n## Step 2 \u2014 Run it on a real piece\n\nA run in a session that didn't write the command shows what the command and your brain do on their own, and its draft is what you'll correct next.\n\nThe lesson waits for you. Restart rather than `/clear`. Give the command only what this piece is about, a line or your notes, with no clients' names or passwords: your brain has the rest. If the command isn't found, come back with `/course:lesson` and I'll sort it out.\n\n> **\u25b6 Your turn:** Type `/exit`, then `claude`, then, as your first message, your command with what one real piece is about. When the draft is in, type `/course:lesson`.\n> ```\n> /exit\n> claude\n> ```\n\nRead the draft as you would before sending it. What you'd change is what the next step fixes.\n\n> **\u25b6 Your turn:** Tell me what's wrong in the draft, in your own words.\n\n## Step 3 \u2014 Correct it where it lasts\n\nA correction said only in our conversation is gone next session; one written where it belongs is read every time that kind of work is done. So stop fixing the same mistake by hand every time; start saying the rule once.\n\nWhere it's written depends on what it is: a fact about your business goes to its page; a rule for all your work to `CLAUDE.md`, or to `voice.md` if it's about how you sound; a rule for this job only to the command. Claude Code shows you the change before it's written. Then a separate reviewer reads the command and the rule; if it asks for a change, you make it and it checks again.\n\n> **\u25b6 Your turn:** Pick one thing that was wrong, and tell me the rule that fixes it, in your own words.\n\nYour rule is in the file it belongs in, and `log.md` lists it as a correction.\n\n## Step 4 \u2014 Run it again\n\nA fix lasts only if a run that never heard the correction follows it.\n\nRestart again, and give the command only what this piece is about, with no clients' names. If the rule doesn't hold, come back anyway: we'll look at why.\n\n> **\u25b6 Your turn:** Type `/exit`, then `claude`, then, as your first message, your command with a second real piece. When the draft is in, type `/course:lesson`.\n> ```\n> /exit\n> claude\n> ```\n\nNothing here is graded. Look for whether your rule held.\n\n> **\u25b6 Your turn:** Tell me whether your rule held, and anything else you'd now correct.\n\n## You can now\n\nA piece of writing you do again and again is one command: you type `/` and its name with what the piece is about, and it's drafted from your brain. When it's wrong, you say the rule once, for all your work or this job, and it's kept where it lasts. Your command and your first correction are in your business's folder, listed in `log.md`.\n\n## Next\n\nNext comes a week of real use, on your own work. First, a short set-up: your first run, your next change, and a check of your brain.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your command and your first correction are written, at the end of Step 3, a separate reviewer that wasn't part of our conversation reads them. If it says \"Not yet\", you change what it names and I have it checked again. Once it passes, you run the command once more in Step 4, which is yours to see. Then the lesson is done, and we set up your first week.\n\n### How it's checked\n\nThe reviewer reads only your files: the command's file, `CLAUDE.md`, `voice.md` or the page your rule went to, and `log.md`. It doesn't judge the drafts or your writing: it judges whether the command and the correction are specific enough to work.\n\n**Must-haves** (all needed to pass):\n\n1. Your command says what it produces, and at least two things you'd send a draft back for, that someone could check in it and a draft could get wrong. (Step 1)\n2. Your command says what it needs from your brain: the pages, or kinds of fact, it reads. (Step 1)\n3. Your correction is a rule someone could check in a draft, written in a file, not only said in our conversation. (Step 3)\n4. Your rule sits where it applies: in the command, about this job's drafts; or in `CLAUDE.md`, `voice.md` or the page it's about, worded for all your work. (Step 3)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- The command says what it asks you before deciding, beyond the calls in `CLAUDE.md`.\n- A second correction, from the second run, filed the same way.\n"</script>
