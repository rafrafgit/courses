<script id="md" type="application/json">"# Lesson 2 \u2014 Keep your brain current\n\n*In 3 steps.*\n\n## What you'll get\n\nAfter this lesson, when something changes in your business, you type `/bring-in` and say what changed: I update every page it touches and log it, and Claude Code asks you before I rewrite what your business says it is. You'll have your brain brought up to date: the changed pages, each keeping the old version below, dated; `log.md`, listing what came in; a decision file in `decisions/` if you call the change one; and in `CLAUDE.md`, which further pages you approve. All in your business's folder.\n\n1. Bring in a real change with `/bring-in`.\n2. Bring in a document or a note that overlaps what your brain says, and settle what disagrees.\n3. Ask for a piece of your work in a fresh session, and see it use the change.\n\n## Before we start\n\nHave ready the change you noted at the end of Lesson 1: something recent or coming that replaces what your brain says now. If you didn't note one, think of a price, an offer or a way of working that's changed this year. A document that covers what your brain says helps too, such as an old flyer; a note you type works as well. Changes come in with `/bring-in`, the command your brain came with; it's in the `skills` folder.\n\n## Step 1 \u2014 Bring in your change\n\nA brain goes out of date one unrecorded change at a time: the rate you raised in spring, the package you quietly dropped. Bring each change in as it happens, with its date, and every later piece of work gets it right. So stop updating your files by hand, or leaving them out of date; start telling the brain once.\n\nI'll show you a plan first: each page the change touches, and whether I write it or you approve it. Pages that say what your business is wait for your yes at Claude Code's prompt, and the old version stays below, dated. I'll also ask whether the change is a decision, and if so, why. Leave clients' names and passwords out.\n\n> **\u25b6 Your turn:** Type `/bring-in` followed by what changed and from when, in your own words.\n\nYour change is in `inbox/`, saved as you typed it, and `log.md` lists each page it touched.\n\n## Step 2 \u2014 Settle what disagrees\n\nMaterial written at different times disagrees: last year's flyer, this year's prices, a note you wrote in a hurry. Only you know which is true now, so wherever they disagree I show you both, with where each came from, and never choose. And beyond the pages that say what your business is, only you can say which pages, if any, you want to see before I change them.\n\nKeep out clients' names, and anything you'd rather I never quote goes to `private/`: I can read it, but it stays out of the pages. When this is in, a separate reviewer reads your brain before we go on.\n\n> **\u25b6 Your turn:** Type `/bring-in` and give me something that covers what your brain already says: tell me where a document is, or write a note in your own words.\n\nWhat came in is filed in the pages it touches, a new page as a draft in `customers/` or `notes/`; your answer on which pages you approve is in `CLAUDE.md`, under \"Pages I approve\".\n\n## Step 3 \u2014 Ask for work that uses the change\n\nOnly a session that starts after the change shows whether your brain, not this conversation, now carries it.\n\nThe lesson waits for you. Restart rather than `/clear`, so the new session reads your brain from its first moment, and make your request its first message, with no background: the point is to see what the brain carries.\n\n> **\u25b6 Your turn:** Type `/exit`, then `claude`, and ask for a piece of your usual work that depends on your change. Then type `/course:lesson`.\n> ```\n> /exit\n> claude\n> ```\n\nNothing here is graded. Look for which version it used, whether that's right for the date the work is for (a coming change: the old version until it takes effect), and the page it names as its source.\n\n> **\u25b6 Your turn:** Tell me which version it used, and whether that's right for when the work is for.\n\n## You can now\n\nWhen something changes in your business, you type `/bring-in` and say what changed: I update every page it touches and keep the old version, dated, and Claude Code asks you before I rewrite what your business is. Your brain in your business's folder is current: the changed pages, `log.md`, any decision in `decisions/`, and in `CLAUDE.md`, which further pages you approve, if any.\n\n## Next\n\nIn Lesson 3 you hand over a piece of writing you do again and again: one command does it from your brain, and your corrections stick.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your change and the older material are in, at the end of Step 2, a separate reviewer that wasn't part of our conversation reads your brain. If it says \"Not yet\", you change what it names and I have it checked again. Once it passes, you run the test in Step 3, which is yours to see: nothing in it is graded. Then the lesson is done.\n\n### How it's checked\n\nThe reviewer reads only your brain's files: the pages, `log.md`, `inbox/`, `decisions/` and `CLAUDE.md`. It doesn't judge your business or whether the change was a good idea: it judges whether the brain now holds it, the way this lesson asks.\n\n**Must-haves** (all needed to pass):\n\n1. Your change is in: what changed and from when (or that it's already in effect), and the page it touches says the new version with its date; a coming change shows both, each dated. (Step 1)\n2. If you called the change a decision, its file says what was decided and why: any reason you could weigh again. (Step 1)\n3. No disagreement is left open: the pages you brought something into have no `[ASK]`, \"TBD\" or \"?\" left in their summaries. (Step 2)\n4. Your `CLAUDE.md` says which further pages need your yes, in a way I can recognise (a page or a kind of page), or that none do. (Step 2)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- A new page for a kind of customer says who they are and what they buy, without naming anyone.\n- Something you'd rather not see quoted is in `private/`.\n"</script>
