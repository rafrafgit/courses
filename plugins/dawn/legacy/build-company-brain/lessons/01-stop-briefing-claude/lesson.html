<script id="md" type="application/json">"# Lesson 1 \u2014 Stop briefing Claude\n\n*In 4 steps.*\n\n## What you'll get\n\nAfter this lesson, you ask Claude for a piece of your work in one line, and it comes back built on what your business is: what you sell, your prices, how you work. The calls that are yours, it brings back to you instead of guessing. You'll have your brain's first pages, `company.md` and `offer.md`, and your calls in `CLAUDE.md`, all in your business's folder. You can open any of them; I'll show you how.\n\n1. Give me your business, typed or from a document, and read my first drafts.\n2. Bring in past proposals if you have them, and correct the drafts.\n3. Tell me which calls are yours.\n4. Ask for a piece of your work in a second session, where nothing from this lesson is said.\n\n## Before we start\n\nYour company brain is this folder, the one you named after your business: plain notes on your computer that I read before I work. Nothing in it is about your business yet; `CLAUDE.md` holds the rules I follow. Have ready what you'd tell someone about your business, any documents that say it, and one piece of work you'll want done.\n\n## Step 1 \u2014 Give me your business\n\nThink of someone minding your stall for a week. They take your price list, fix what's out of date before opening, and ask you about what isn't on it. I'm in the same spot: your price list may be a year old, your website may promise what you've stopped offering, and I can't tell. I draft only what your material says, and mark every gap `[ASK: \u2026]`. The gaps show you exactly what only you know. So stop briefing the AI every time; start giving it your business once, where every session reads it.\n\nWhat comes in lands in `inbox/` and, once I've filed it, moves to `sources/`, kept as it came. So keep passwords out, and what changes on its own, like this week's bookings. Client documents come in the next step.\n\n> **\u25b6 Your turn:** Give me your business, with nothing that names a client yet: type what you sell, to whom, at what price and how you work; or tell me in plain words where a document is that says it (your price list in Downloads, say).\n\nMy drafts are in this folder: `company.md` and `offer.md`, each marked as a draft, with my questions marked `[ASK: \u2026]`. You can open any file in your folder and read it; I'll show you how.\n\n> **\u25b6 Your turn:** Open `company.md` and `offer.md`, and read my drafts there.\n\n## Step 2 \u2014 Bring in your proposals, and correct me\n\nWhat you charged one client isn't necessarily your price, and an old proposal can contradict your price list. If I picked one, I'd be guessing, and my guess would read like fact. So where sources disagree, or a figure comes from one client's job, I mark it `[ASK]` and ask you.\n\nA proposal with a client's email or phone goes to `private/`, not `sources/`: I read it, like everything you give me, and never quote it in a page. It's still in the folder. The clients a document names get draft pages in `customers/`. Leave out anything under an NDA. Then I ask my questions, and Claude Code shows you each change before it's written: choose Yes, or No and tell me what's true.\n\n> **\u25b6 Your turn:** If you have past proposals or other documents that name clients, tell me where they are; if not, say so, and I'll go straight to my questions.\n\nYour brain's first pages are written: `company.md` and `offer.md`. Your answers are kept, as you typed them, in `sources/`. A change at the prompt shows one line; the page shows what your brain now says as a whole.\n\n> **\u25b6 Your turn:** Open `company.md` and `offer.md` again, read them through, and tell me anything that isn't true.\n\n## Step 3 \u2014 Tell me which calls are yours\n\nYour pages now settle the facts. The calls that are yours should come back to you, as the stall-minder would leave you whether to open on a Sunday. I need to know which calls those are.\n\nI'll write your answer into `CLAUDE.md`, the file I read at the start of every session, and Claude Code will ask you before it's written. Then your pages and calls are reviewed; if the answer is \"Not yet\", I'll tell you what to change.\n\n> **\u25b6 Your turn:** Tell me, in your own words, which kinds of decision you want brought back to you instead of me making them. A piano teacher might keep any refund for a missed lesson.\n\nYour calls are in `CLAUDE.md` in this folder, under \"Calls that are mine\".\n\n> **\u25b6 Your turn:** Open `CLAUDE.md`, and read your calls there.\n\n## Step 4 \u2014 Ask for a piece of your work\n\nOnly a session that never heard this lesson shows what your brain does on its own. This conversation watched you build it, so it knows too much to be a fair test.\n\nSo from now on there are two sessions in this folder. This one is your lesson: the lesson, and commands like `/bring-in`, happen here. A second one, your work session, is only for runs; I'll show you how to open it. Where the work reaches a call of yours, it's marked for you rather than decided. The result is saved in `work/other/`.\n\n> **\u25b6 Your turn:** Open your work session, then ask it for a piece of your work in one line, one that touches a call you named. When the result is in, come back here and tell me.\n\nNothing here is graded: you're the reviewer now. Open the result in the work session. Look for the facts it took from your pages, the pages it names, how it handled your call, and anything it states that your brain doesn't have. Keep the work session open for the next lessons.\n\n> **\u25b6 Your turn:** Tell me what the result took from your pages, how it handled your call, and anything it got wrong.\n\n## You can now\n\nYou can ask Claude for a piece of your work in one line and get it back built on your business, with the calls that are yours brought back to you. Your brain's first pages, `company.md` and `offer.md`, draft pages for clients your documents named, and your calls in `CLAUDE.md` are in your business's folder; the run's result is in `work/other/`. You can open any of them whenever you like.\n\n## Next\n\nIn Lesson 2 you bring in a real change and a client's material, and I keep the brain current. Have ready one real change, recent or coming, and one client's material not yet brought in: a past proposal, an enquiry, or notes on the work. With no clients yet, a prospect's enquiry or notes on the kind of client you're after.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your brain's first pages and your calls are written, at the end of Step 3, a separate reviewer that wasn't part of our conversation reads them. If it says \"Not yet\", you change what it names, and I have it checked again. Once it passes, you run the test in Step 4, which is yours to see: nothing in it is graded. Then the lesson is done.\n\n### How it's checked\n\nThe reviewer reads only two things in your brain: the summaries at the top of `company.md` and `offer.md` (the dated history below them isn't judged), and the calls section of `CLAUDE.md`. It doesn't open your documents or judge your business, which documents you brought, or the run. It judges whether your brain holds what this lesson asks of you, specifically enough to work.\n\n**Must-haves** (all needed to pass):\n\n1. Your pages say what you sell, to whom, at what price (or how you price, even \"not set yet\" with what you're aiming at) and how the work is done, with no gap left open and nothing that changes on its own, like bookings. (Step 2)\n2. Your `CLAUDE.md` names the kinds of call I bring back to you instead of making, specific enough to tell whether a new call is one. (Step 3)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- Each call you keep says what you want brought with it (the options, what it would cost, who's waiting).\n- Your brain says where the business is going: a goal, and by when.\n"</script>
