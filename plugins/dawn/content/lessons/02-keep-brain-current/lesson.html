<script id="md" type="application/json">"# Lesson 2 \u2014 Keep your brain current\n\n*In 4 steps.*\n\n## What you'll get\n\nAfter this lesson, when something in your business changes or a client gets in touch, you drop it in and I file it everywhere it belongs, citing where it came from. I bring back to you anything that would change what your business says it is, and show you both versions when the new disagrees with the old. You'll have your brain updated in your business's folder: your first client's page in `customers/`, `log.md` recording every change, and `/check-brain` to find what's slipped.\n\n1. Tell me one real change, and approve what it changes.\n2. Bring in a client's material, and settle what disagrees.\n3. Check your brain for what's slipped, and choose which pages need your yes.\n4. Ask for work that depends on what's new, in your work tab.\n\n## Before we start\n\nHave ready the change you noted at the end of Lesson 1, something recent or coming that replaces what your brain says now, and one client's material not yet brought in: a past proposal, an enquiry, or notes on the work. With no clients yet, a prospect's enquiry or notes on the kind of client you're after. Both come in with `/bring-in`, a command your brain came with.\n\n## Step 1 \u2014 Bring in your change\n\nA brain goes out of date one unrecorded change at a time: the rate you raised in spring, the package you quietly dropped. Bring each change in as it happens, with its date, and every later piece of work gets it right. So stop updating your files by hand, or leaving them out of date; start telling the brain once.\n\nPages that say what your business is, like `offer.md`, wait for your yes: Claude Code shows the change and asks before writing it. The old version stays below, dated. Keep passwords out, as before.\n\n> **\u25b6 Your turn:** Type `/bring-in` followed by what changed and from when, in your own words.\n\nYour change is filed in `sources/`, saved as you typed it, and `log.md` lists each page it touched. The prompt showed you one change; the pages show what your brain now says.\n\n> **\u25b6 Your turn:** Ask me to open the pages your change touched, and read them through.\n\n## Step 2 \u2014 Bring in a client, and settle what disagrees\n\nA proposal from two years ago, an enquiry with its own terms, your notes after a job: material written at different times, for different clients, disagrees with what your business says now. Only you know which version is true, and whether one client's arrangement is your rule or an exception. So wherever they disagree I show you both, with where each came from, and never choose.\n\nA document with the client's email or phone is filed to `private/`, read and never quoted. The client gets a page in `customers/`. Leave out anything under an NDA.\n\n> **\u25b6 Your turn:** Type `/bring-in` and give me one client's material: tell me where a document is, or write a note in your own words.\n\nYour client's page is in `customers/`, and `log.md` lists every page the material touched.\n\n> **\u25b6 Your turn:** Ask me to open your client's page and the other pages the material touched, and read them through.\n\n## Step 3 \u2014 Check your brain\n\nPages drift as they're filed one change at a time: a summary falls behind its history, a claim loses its source. Only checking the whole brain finds what no single change shows. When the findings are settled, your brain is reviewed; if the answer is \"Not yet\", I'll tell you what to change.\n\n> **\u25b6 Your turn:** Type `/check-brain`.\n\nEach finding and what you decided is in `log.md`; your answer on which pages need your yes is in `CLAUDE.md`, under \"Pages I approve\".\n\n> **\u25b6 Your turn:** Ask me to open `CLAUDE.md`, and read your answer under \"Pages I approve\".\n\n## Step 4 \u2014 Ask for work that uses what's new\n\nOnly a session that never heard this lesson shows whether your brain, not this conversation, now carries the change.\n\nThe run happens in your work tab, the second tab from Lesson 1. `/clear` starts it fresh, and it reads your brain from the start. Add no background: the point is to see what the brain carries. The result is saved in `work/other/`. Come back to this tab when it's in.\n\n> **\u25b6 Your turn:** In your work tab, type `/clear`, then ask for a piece of your work that depends on your change or your client. Ask that session to open the result, then come back here and tell me it's in.\n> ```\n> /clear\n> ```\n\nNothing here is graded. In the result: which version did it use, is that right for when the work is for (a coming change: the old version until it starts), and which pages does it name?\n\n> **\u25b6 Your turn:** Tell me which version and which pages it used, and whether that's right for when the work is for.\n\n## You can now\n\nWhen something changes, or a client gets in touch, you type `/bring-in`: I file it in every page it touches, keep the old version, dated, and Claude Code asks you before I rewrite what your business is. `/check-brain` finds what's slipped. In your business's folder: your client's page in `customers/`, `log.md`, any decision in `decisions/`, and your choice under \"Pages I approve\".\n\n## Next\n\nIn Lesson 3 you hand over work you do again: one command does it from your brain, and your corrections stick. Pick one piece of work you do again, however often, that I can do from your brain without your email, calendar or other tools, and that you'd check before using: a proposal for each new client, a report after each project, a reply to a question clients often ask, a post. Have three real pieces of it: past pieces and work coming up both count.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your change, your client's material and your check of the brain are all in, at the end of Step 3, a separate reviewer that wasn't part of our conversation reads your brain. If it says \"Not yet\", you change what it names, and I have it checked again. Once it passes, you run the test in Step 4, which is yours to see: nothing in it is graded.\n\n### How it's checked\n\nThe reviewer reads your brain's pages, `log.md`, `decisions/` and `CLAUDE.md`. Which pages you mark verified, and what stays in `private/`, are yours, and aren't judged. It doesn't open your documents, judge your business, or decide whether the change was a good idea: it judges whether the brain now holds it, the way this lesson asks.\n\n**Must-haves** (all needed to pass):\n\n1. The page your change touches states the new version with when it applies, or that it's in effect now; a coming change shows both versions, each dated. (Step 1)\n2. If you called the change a decision, its file says what was decided and why: any reason you could weigh again. (Step 1)\n3. No question is left open: the pages your change and your client's material touched have no `[ASK]`, \"TBD\" or \"?\" standing for an open question left in their summaries, and don't disagree with each other or with your offer without saying which version applies; \"not known yet\" answers a fact nobody has yet, not a disagreement. (Step 2)\n4. Your `CLAUDE.md` says which further pages need your yes, in a way anyone could recognise (a page or a kind of page), or that none do. (Step 3)\n5. Every finding of your latest `/check-brain` has an outcome: the page it names says what you decided, or `log.md` says why it stays as it is. (Step 3)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- Your client's page says what you'd want to remember before working with them again.\n- Something you'd rather not see quoted, beyond contact details, is in `private/`, and named in `log.md`.\n"</script>
