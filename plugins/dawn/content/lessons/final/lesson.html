<script id="md" type="application/json">"# Final task \u2014 Turn something new into finished work\n\n*In 4 steps, on your own.*\n\n## What you'll get\n\nThis time you do it on your own, as you will from now on. Something new comes into your business, and you take it all the way: into your brain, the brain checked, your command run on work that needs it, and what the result shows you added where it lasts, so the next run is better. You'll have it all in your business's folder: the pages it changed, the result in `work/`, and your new rule or check. When it passes, the course is complete.\n\n1. Bring in what's new.\n2. Check your brain.\n3. Run your command on work that depends on it, in your work tab.\n4. Review the result, and add what it teaches you.\n\n## Before we start\n\nHave ready the new thing and the third piece of work you set aside at the end of Lesson 3; the work should need the new thing. Keep out what you kept out before. This time I don't name your choices or teach: you've made each before, and if you're unsure how, I'll say which lesson. What passes is on the course's reference page: type `/dawn:mentor read` to open it.\n\n## Step 1 \u2014 Bring in what's new\n\nNew material is worth only what it changes in your brain. Until it's filed and settled, the next run works from the old version.\n\n> **\u25b6 Your turn:** Type `/bring-in` and give me what's new.\n\nWhat's new is filed, and `log.md` lists the pages it touched.\n\n> **\u25b6 Your turn:** Ask me to open the pages your new material touched, and read them through.\n\n## Step 2 \u2014 Check your brain\n\nWhat you just brought in may now contradict your offer, or a page from Lesson 2. Check before the work relies on it, not after it goes wrong.\n\n> **\u25b6 Your turn:** Type `/check-brain`.\n\nEach finding and what you decided is in `log.md`.\n\n> **\u25b6 Your turn:** Ask me to open each page your decisions rewrote, and read it there; if none did, tell me so.\n\n## Step 3 \u2014 Run your command\n\nOnly a session that didn't hear today's conversation shows whether your brain, not you, carries what's new.\n\nThe run happens in your work tab, after `/clear`. The result is saved in `work/`, in a folder with your command's name.\n\n> **\u25b6 Your turn:** In your work tab, type `/clear`, then your command with the piece of work that needs what's new. Ask that session to open the result, then come back here and tell me it's in.\n> ```\n> /clear\n> ```\n\n## Step 4 \u2014 Review it, and add what it teaches\n\nA review that changes nothing is forgotten by the next run. What you learn from a result is worth only what you write where the next run reads it. If something's wrong, that's a rule or a fact that fixes it; if nothing is, it's one more thing a good result must get right, which you'd now check for. I file it where it lasts, as in Lesson 3.\n\n> **\u25b6 Your turn:** Read your result in `work/` as you would before using it, and tell me the rule, fact or check it leads to.\n\nWhat you added is in its file, and `log.md` lists it: it's where the next run reads it. Once you've read it, it's reviewed, and when that passes, the course is complete.\n\n> **\u25b6 Your turn:** Ask me to open the file your addition went into, read it there, and tell me it says what you meant.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your new rule or check is written, at the end of Step 4, a separate reviewer that wasn't part of our conversation reads your brain, your command and the result. If it says \"Not yet\", you change what it names, and I have it checked again. When it passes, the course is complete.\n\n### How it's checked\n\nThe reviewer reads the pages your new material touched, `log.md`, your command, the result, and the file your rule or check went into. It never judges the result's quality or what you say about it: it judges whether your brain took in what's new, whether your command's run used it, and whether what you added from the run concerns that result and can be checked.\n\n**Must-haves** (all needed to pass):\n\n1. The pages your new material touched say what's new, with when or for whom it applies where it replaces something, and leave no question open. If it changes no page's summary, the pages it added to just need no open question. (Step 1)\n2. Every finding of your `/check-brain` has an outcome: the page says what you decided, or the log says why it stays. (Step 2)\n3. Your command's result, run after you brought the new material in, names among the pages it used one that the new material added to or changed. (Step 3)\n4. From this run, you added a rule or fact that fixes something in the result, or a check a good result must also pass that applies to it, that someone could check a result against. (Step 4)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- Your rule says what to do instead, not only what to avoid.\n- More than one thing added from the run, each filed where it lasts.\n"</script>
