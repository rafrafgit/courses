<script id="md" type="application/json">"# Lesson 3 \u2014 Hand over a recurring job\n\n*In 4 steps.*\n\n## What you'll get\n\nAfter this lesson, a piece of work you do again is one command: you type `/` and its name with what this piece is about, and it's done from your brain and saved in your folder. When it's wrong, you say the rule once, and whether it's for all your work or this job, and it goes where it lasts. You'll have the command, under the `skills` link in your business's folder; its results in `work/`; and your first correction, in the file it belongs in.\n\n1. Tell me the job, what a good result must get right, what it needs, and what I do at a gap.\n2. Run it on a real piece, in your work session, and say what's wrong.\n3. Tell me the rule that fixes it, and how far it reaches.\n4. Run it again, and see the fix hold.\n\n## Before we start\n\nHave ready the work you picked at the end of Lesson 2: something you do again, however often, that I can do from your brain and you'd check before using. Bring three real pieces of it, or what each is about: one to run now, one for after your correction, one for the final task. Past pieces and work coming up both count.\n\n## Step 1 \u2014 Describe the job\n\nAsked to \"write a proposal\", I write the average proposal: right facts, nothing that makes it yours. What makes it yours is what you'd send back, and only you know that. A command keeps those checks with the job, in its own file, read only when you type `/` and its name, so it never crowds your other work. Naming the pages it needs makes it read those, not guess.\n\nA job will also meet gaps: a call that's yours, or a fact your brain doesn't have. Whether I ask you first there, or finish the rest and mark the gap for you, is yours to say, once, for all your work. I'll write your answers into the command and into `CLAUDE.md`; Claude Code shows each to you before it's written.\n\n> **\u25b6 Your turn:** Tell me, in your own words, the job you're handing over, what it produces, what you'd send a result back for, what it needs from your brain, and a name for its command.\n\nYour command is `/` and the name you gave it, in its own folder under the `skills` link in your business's folder. Note the name: you'll type it in your work session.\n\n> **\u25b6 Your turn:** Open your command's file and `CLAUDE.md`, and read your job and your gap choice there, in your words.\n\n## Step 2 \u2014 Run it on a real piece\n\nA run in a session that didn't write the command shows what the command and your brain do on their own, and its result is what you'll correct next.\n\nThe run happens in your work session. `/clear` starts it fresh. Give the command only what this piece is about, a line or your notes, and no passwords: your brain has the rest. The result is saved in `work/`, in a folder with your command's name. If the command isn't found, come back here and I'll sort it out.\n\n> **\u25b6 Your turn:** In your work session, type `/clear`, then your command with what one real piece is about. Open the result, then come back here and tell me it's in.\n> ```\n> /clear\n> ```\n\nRead the result as you would before using it. What you'd change is what the next step fixes.\n\n> **\u25b6 Your turn:** Tell me what's wrong in the result, in your own words, or that nothing is.\n\n## Step 3 \u2014 Correct it where it lasts\n\nA correction said only in our conversation is gone next session; one written where it belongs is read every time that kind of work is done. So stop fixing the same mistake by hand every time; start saying the rule once.\n\nWhere it goes depends on what it is. A fact about your business goes to its page. A rule for all your work goes to `CLAUDE.md`, or `voice.md` if it's about how you sound. A rule for this job only goes in the command. Claude Code shows you a rule before it's written. Then your command, gap choice and correction are reviewed; Step 4 comes once that passes.\n\n> **\u25b6 Your turn:** Pick one thing that was wrong, and tell me the rule that fixes it, in your own words.\n\nYour correction is in the file it belongs in, and `log.md` lists it as a correction.\n\n> **\u25b6 Your turn:** Open the file your correction went into, and read your rule there.\n\n## Step 4 \u2014 Run it again\n\nA fix lasts only if a run that never heard the correction follows it.\n\nRun it in your work session again, after `/clear`, with only what the next piece is about. If the rule doesn't hold, come back anyway: we'll look at why.\n\n> **\u25b6 Your turn:** In your work session, type `/clear`, then your command with what your second piece is about. Open the result, then come back here and tell me it's in.\n> ```\n> /clear\n> ```\n\nNothing here is graded. In the new result, look for the place your rule should have changed.\n\n> **\u25b6 Your turn:** Tell me whether your rule held, and where you see it.\n\n## You can now\n\nThe work you do again is one command now: it's done from your brain and saved in `work/`, and a correction goes where it lasts, so the next run gets it right. In your business's folder: your command under `skills`, its results in `work/`, your gap rule in `CLAUDE.md`, and your correction in its file.\n\n## Next\n\nThe final task is yours alone: something new comes in, and you take it all the way, from your brain to finished work. Have your third piece ready, and the new thing it will need: another client's or prospect's material, a change, or a past piece you held back.\n\n## Reference: how it's checked\n\n### Reviews\n\nWhen your command, your gap choice and your first correction are written, at the end of Step 3, a separate reviewer that wasn't part of our conversation reads them. If it says \"Not yet\", you change what it names, and I have it checked again. Once it passes, you run the command again in Step 4, which is yours to see: nothing in it is graded.\n\n### How it's checked\n\nThe reviewer reads your command's file, your `CLAUDE.md`, and the file your correction went into (`voice.md` or a page, if it went there). It doesn't read the results in `work/` or judge your work: it judges whether your command, what you chose for gaps, and your correction say what this lesson asks, specifically enough to work.\n\n**Must-haves** (all needed to pass):\n\n1. Your command says what it produces, and at least one thing about its content you'd send a result back for, that someone could check in it (not only its length). (Step 1)\n2. Your command says what it needs from your brain: the pages, or kinds of fact, it reads. (Step 1)\n3. Your `CLAUDE.md` says what I do when work reaches a call that's yours or a fact your brain lacks: ask first, or finish and mark it, or when each, clearly enough to apply. (Step 1)\n4. Your correction is a rule, or a fact on its page, that someone could check a result against. (Step 3)\n\n**Nice-to-haves** (not needed to pass, but you'll get feedback on them):\n\n- The command says what it brings back to you, beyond the calls in `CLAUDE.md`.\n- Your rule says what to do instead, not only what to avoid.\n"</script>
